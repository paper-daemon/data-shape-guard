name: Data Shape Guard tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and CLI regression tests
        run: python -m unittest -v tests.test_data_shape_guard
      - name: CLI help smoke test
        run: python data_shape_guard.py compare --help
